<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
</head>
<body>

<script>
(function () {

    const path = window.location.pathname;

    // /port/ এর পরের নাম বের করবে
    const match = path.match(/^\/port\/([^\/]+)\/?$/);

    if (match) {

        const slug = match[1];

        // .html ফাইলে redirect
        window.location.replace(
            "/port/" + slug + ".html"
        );

    } else {

        document.body.innerHTML = "<h2>Page Not Found</h2>";

    }

})();
</script>

</body>
</html>
