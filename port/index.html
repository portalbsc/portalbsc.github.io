  const path = window.location.pathname;
  const match = path.match(/^\/port\/([^\/]+)\/?$/);

  if (!match) {
    document.body.innerHTML = "<h2>Invalid link</h2>";
    return;
  }

  const slug = decodeURIComponent(match[1]);

  // আপনার Blogger destination
  const target =
    "https://blogger-site-linked.blogspot.com/2026/09/viral-pdf.html";

  // Redirect
  window.location.replace(target);

})();
</script>
